    <style>
      html, body { background-color: #0a0a0a; color: #f2f2f2; }
      #native-startup-fallback {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;

      #native-startup-fallback strong { display: block; margin-bottom: 8px; font-size: 18px; }

    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('app_theme');
          if (t !== 'light') {
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.style.background = '#fafafa';
            document.body && (document.body.style.background = '#fafafa');
          }
        } catch (e) {}
      })();
    </script>
    <script>
      window.__showDailyDominatorStartupError = function (message) {
        var el = document.getElementById('native-startup-fallback');
        if (!el) return;
        el.innerHTML = '<div><strong>Daily Dominator לא נטען</strong><span>קבצי האפליקציה או JavaScript לא עלו במכשיר.</span><code></code></div>';
        el.querySelector('code').textContent = message || 'Unknown startup error';
      };
      window.addEventListener('error', function (event) {
        window.__showDailyDominatorStartupError(event.message || String(event.error || event));
      });
      window.addEventListener('unhandledrejection', function (event) {
        window.__showDailyDominatorStartupError((event.reason && event.reason.message) || String(event.reason || event));
      });
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && document.getElementById('native-startup-fallback')) {
          window.__showDailyDominatorStartupError('Missing bundled assets. Run: npm install && npm run cap:sync:ios, then clean and run from Xcode.');
        }
      }, 8000);
    </script>
